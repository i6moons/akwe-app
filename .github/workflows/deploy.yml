name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: Vercel — production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Vérifier que les secrets Vercel sont configurés
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN absent. Ajoutez-le dans Settings > Secrets > Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm install --global vercel@latest

      - name: Récupérer la configuration de production
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publier
        id: publish
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 En ligne : $URL" >> "$GITHUB_STEP_SUMMARY"
