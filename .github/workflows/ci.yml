name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Qualité (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Publier la couverture
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: frontend/coverage/
          retention-days: 7

  build:
    name: Build de production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'

  e2e:
    name: Parcours de démo (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Installer les navigateurs
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
      - name: Lancer les tests e2e
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  sql:
    name: Schéma SQL (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: akwe
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - name: Appliquer les migrations sur une base neuve
        env:
          PGPASSWORD: akwe
        run: |
          # Postgres de CI n'a pas le schéma Auth de Supabase. Sans ce socle,
          # `0002` échoue sur `auth.uid()` et `0003` sur `auth.users`.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'EOSQL'
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            phone text,
            email text,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$ select null::uuid $$;
          EOSQL
          # Toutes les migrations, dans l'ordre. N'appliquer que `0001` laissait
          # `0002` à `0004` sans aucune validation : la base hébergée s'est ainsi
          # retrouvée sans les colonnes et la contrainte que le code attend.
          for file in supabase/migrations/*.sql; do
            echo "→ $file"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"
          done

  backend:
    name: Types et tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Types et tests
        run: npm run verify
