name: Aperçu de branche

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  preview:
    name: Vercel — aperçu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ignorer si Vercel n'est pas encore configuré
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aperçu ignoré : VERCEL_TOKEN non configuré."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - if: steps.guard.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - if: steps.guard.outputs.configured == 'true'
        name: Déployer l'aperçu
        id: deploy
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.configured == 'true'
        name: Commenter la PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔎 **Aperçu de cette branche** : ${url}\n\nTestez-la sur téléphone, en coupant le réseau.`,
            });
